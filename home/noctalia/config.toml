[audio]
enable_sounds = true
sound_volume = 0.99999997764825821

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.84999998100101948
    capsule = true
    capsule_fill = "on_primary"
    capsule_foreground = "primary"
    center = [ "workspaces" ]
    end = [
        "widget",
        "tray",
        "notifications",
        "clipboard",
        "bluetooth",
        "volume",
        "brightness",
        "network",
        "battery",
        "group:g1",
        "weather",
        "session",
        "mirror"
    ]
    font_family = "IBM Plex Sans"
    margin_ends = 0
    radius = 0
    radius_top_left = 0
    start = [ "launcher", "cat", "group:g2", "bar_2", "bar_3", "audio_visualizer" ]

        [[bar.Main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "on_primary"
        foreground = "primary"
        id = "g1"
        members = [ "date", "clock" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "on_primary"
        foreground = "primary"
        id = "g2"
        members = [ "cpu", "ram", "sysmon" ]
        opacity = 1.0
        padding = 6.0

